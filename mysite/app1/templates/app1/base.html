<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}livraria{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <nav class="navbar md:navbar-expand bg-1 fg-2">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Livraria</a>
          <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon" aria-hidden="true"></span>
          </button>
          <dialog class="drawer drawer-end" tabindex="-1" id="navbarText" aria-labelledby="navbarTextLabel">
            <div class="drawer-header">
              <h5 class="drawer-title" id="navbarTextLabel">Menu</h5>
              <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
            </div>
            <div class="drawer-body">
              <ul class="navbar-nav me-auto mb-2 md:mb-0">
                <li class="nav-item">
                  <a class="nav-link" aria-current="page" href="/">Home</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="/listalivro">Lista Livros</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="admin">Área Restrita</a>
                </li>
              </ul>
              <span class="navbar-text">
                Feito para um curso de python :)
              </span>
            </div>
          </dialog>
        </div>
      </nav>
  </nav>

  <main>{% block content %}{% endblock %}</main>

  
<footer class="bg-dark text-white py-4 mt-5">
    <div class="container text-center">
        <h5>Meu Site</h5>

        <p class="text-secondary">
            Aprendendo e desenvolvendo projetos web.
        </p>

        <div class="mb-3">
            <a href="/" class="text-white text-decoration-none mx-2">
                Home
            </a>
            <a href="/sobre" class="text-white text-decoration-none mx-2">
                Sobre
            </a>
            <a href="/contato" class="text-white text-decoration-none mx-2">
                Contato
            </a>
        </div>

        <hr class="border-secondary">

        <small class="text-secondary">
            &copy; 2026 Meu Site. Todos os direitos reservados.
        </small>
    </div>
</footer>

</body>
</html>
