{% extends "textposts/base.html" %}

{% block title %} Grabiz Gallery - Art {% endblock %}

{% block content %}
<h1>Gallery</h1>
<div class="gallery">

    {% for myimage in myimages %}
    <div class="myart slideup"  style="--i: {{ forloop.counter0 }}">
        <img src="{{ myimage.image.url }}" alt="{{ myimage.title }}">
        <p>{{ myimage.title }}</p>
    </div>
    

    
    {% endfor %}
</div>

{% endblock %}
