{% extends "textposts/base.html" %}

{% block title %} Homepage {% endblock %}
href="text/{{ livro.slug }}"
{% block content %}
<div>
    {% for post in posts %}
    <div>
    <a href="read/{{ post.slug }}">
        <div>
            {% if post.image %}
                <img src="{{ post.image }}" alt="{{ post.title }}">
            {% else %}
                <p>Sem banner</p>
            {% endif %}
        </div>
        <div>
            <h2>{{ post.title }}</h2>
            <p>{{ post.subtitle }}</p>
            <span>{{ post.date }}</span>
        </div>
    </a>
    </div>
    {% endfor %}
</div>

{% endblock %}
